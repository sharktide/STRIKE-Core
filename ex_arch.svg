<svg viewBox="0 0 1000 1400" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Arial"><!-- ================= TITLE ================= --><text x="500" y="60" font-size="28" text-anchor="middle" font-weight="bold">Fire Prediction System Architecture</text><!-- ================= INPUT ================= --><rect x="250" y="120" width="500" height="140" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/><text x="500" y="160" text-anchor="middle" font-size="20" font-weight="bold">Tabular Feature Input</text><text x="500" y="190" text-anchor="middle">Temperature | Humidity | Wind | Vegetation | Elevation</text><text x="500" y="215" text-anchor="middle" font-size="13">Shape: (batch_size, 5)</text><line x1="500" y1="260" x2="500" y2="300" stroke="black" stroke-width="3"/><!-- ================= FIRENET ================= --><rect x="100" y="300" width="800" height="600" fill="#F1F8E9" stroke="#2E7D32" stroke-width="4"/><text x="500" y="340" text-anchor="middle" font-size="24" font-weight="bold">FireNet (Classifier + Environmental Modulation)</text><!-- Backbone --><rect x="150" y="380" width="450" height="450" fill="#C5E1A5" stroke="#33691E" stroke-width="2"/><text x="375" y="420" text-anchor="middle" font-weight="bold">Neural Backbone (MLP)</text><text x="180" y="460">Dense(64)</text><text x="180" y="480" font-size="13">W₁ ∈ ℝ(5×64)</text><text x="180" y="500" font-size="13">Z₁ = X · W₁ + b₁</text><text x="180" y="520" font-size="13">A₁ = ReLU(Z₁)</text><text x="180" y="570">Dense(32)</text><text x="180" y="590" font-size="13">W₂ ∈ ℝ(64×32)</text><text x="180" y="610" font-size="13">Z₂ = A₁ · W₂ + b₂</text><text x="180" y="630" font-size="13">A₂ = ReLU(Z₂)</text><text x="180" y="680">Dense(1)</text><text x="180" y="700" font-size="13">W₃ ∈ ℝ(32×1)</text><text x="180" y="720" font-size="13">P_raw = σ(A₂ · W₃ + b₃)</text><!-- Environmental --><rect x="650" y="380" width="200" height="450" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/><text x="750" y="420" text-anchor="middle" font-weight="bold">Environmental Rules</text><text x="670" y="470" font-size="13">Cold Penalty</text><text x="670" y="500" font-size="13">Risk Booster</text><text x="670" y="530" font-size="13">Suppression Mask</text><text x="750" y="600" text-anchor="middle" font-size="14" font-weight="bold">P_adj =</text><text x="750" y="625" text-anchor="middle" font-size="14">P_raw × penalty × booster</text><text x="750" y="645" text-anchor="middle" font-size="14">× booster × suppression</text><line x1="500" y1="900" x2="500" y2="950" stroke="black" stroke-width="3"/><!-- ================= FIRETRUSTNET ================= --><rect x="250" y="950" width="500" height="250" fill="#FCE4EC" stroke="#AD1457" stroke-width="4"/><text x="500" y="990" text-anchor="middle" font-size="22" font-weight="bold">FireTrustNet (Trust Regressor)</text><text x="300" y="1040" font-size="14">Dense(16): W ∈ ℝ(5×16)</text><text x="300" y="1070" font-size="14">Dense(8): W ∈ ℝ(16×8)</text><text x="300" y="1100" font-size="14">Trust = 0.5 + sigmoid(z)</text><text x="300" y="1130" font-size="14">Output ∈ [0.5 , 1.5]</text><line x1="500" y1="1200" x2="500" y2="1240" stroke="black" stroke-width="3"/><!-- ================= FINAL ================= --><rect x="325" y="1240" width="350" height="100" fill="#E8EAF6" stroke="#283593" stroke-width="4"/><text x="500" y="1280" text-anchor="middle" font-size="18" font-weight="bold">Final System Output</text><text x="500" y="1310" text-anchor="middle">P_final = P_adj × TrustScore</text></svg>